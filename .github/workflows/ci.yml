name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,onnx,http,modbus]"
      - name: Lint
        run: ruff check .
      - name: Core import without extras
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install -q pydantic numpy orjson pyyaml
          /tmp/core/bin/python -c "import talos.gate, talos.gateway.modbus_proxy; print('core import ok')"
      - name: Tests
        run: python -m pytest -q

  weights-smoke:
    # Pulls the released weights and runs the ONNX judge once. Skipped on forks and PRs without the secret.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,onnx,modbus]" huggingface_hub
      - name: Pull weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TALOS_HF_REPO: ${{ vars.TALOS_HF_REPO }}
        run: |
          if [ -z "$TALOS_HF_REPO" ]; then echo "TALOS_HF_REPO not set; skipping"; exit 0; fi
          talos-pull --dest weights
      - name: ONNX judge smoke
        env:
          TALOS_WEIGHTS: weights
        run: |
          [ -f weights/student.int8.onnx ] || { echo "no weights; skipping"; exit 0; }
          python -m pytest -q tests/test_model_onnx.py
